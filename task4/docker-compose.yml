services:
  api:
    build: .
    ports:
      - "8000:8000"
    env_file:
      - .env
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:16
    environment:
      POSTGRES_USER: patient
      POSTGRES_PASSWORD: secret
      POSTGRES_DB: patients
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U patient -d patients"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7

volumes:
  postgres_data: